[project]
name = "slack-delivery-release-copilot"
version = "0.1.0"
description = "Deterministic, human-in-the-loop release governance copilot for the final 50-100% of the SDLC, demonstrated through a simulated Slack workflow."
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "demo/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
